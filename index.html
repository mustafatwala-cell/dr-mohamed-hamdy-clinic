<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14305F">
<meta name="description" content="عيادة د. محمد حمدي عبد السلام، استشاري الحميات والأطفال. المواعيد والعنوان وحجز الكشف عبر واتساب.">
<title>عيادة د. محمد حمدي</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: split hero (text on the start side, arched portrait on the other),
   then an info column (hours, address) beside the booking form. Form comes first on phones. */
:root {
  --bg: #F3F7FC;
  --surface: #FFFFFF;
  --ink: #0F2342;
  --muted: #4F6280;
  --line: #D5E1EF;
  --brand: #14305F;
  --on-brand: #FFFFFF;
  --sky: #DCEAF8;
  --accent: #0B7F7A;
  --wa: #15803D;
  --on-wa: #FFFFFF;
  --danger: #B3261E;
  --ok: #15803D;
  --focus: #2F6FD0;
  --font-display: 'Reem Kufi', 'Cairo', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1325; --surface: #111E36; --ink: #E9F0FB; --muted: #9DB0CD; --line: #243553;
    --brand: #6BA7F3; --on-brand: #08111F; --sky: #182B4E; --accent: #4FD1C5;
    --wa: #34C27A; --on-wa: #04170C; --danger: #FF8F85; --ok: #4ADE80; --focus: #8DBBFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1325; --surface: #111E36; --ink: #E9F0FB; --muted: #9DB0CD; --line: #243553;
  --brand: #6BA7F3; --on-brand: #08111F; --sky: #182B4E; --accent: #4FD1C5;
  --wa: #34C27A; --on-wa: #04170C; --danger: #FF8F85; --ok: #4ADE80; --focus: #8DBBFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  direction: rtl;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 0 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 1080px; margin-inline: auto; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
.mark { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; }
.top nav { display: flex; align-items: center; gap: 22px; }
.top nav a:not(.btn) { text-decoration: none; color: var(--muted); font-weight: 500; }
.top nav a:not(.btn):hover { color: var(--ink); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 14px; border: 1.5px solid transparent;
  font: 600 16px/1 var(--font-body); text-decoration: none; cursor: pointer;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-wa { background: var(--wa); color: var(--on-wa); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.07); }

/* hero */
.hero { display: grid; grid-template-columns: 1.15fr 0.85fr; align-items: center; gap: 40px; padding-block: 24px 56px; }
.status {
  display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500; color: var(--muted);
}
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.status.open .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.status.closed .dot { background: var(--danger); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 6vw, 58px); line-height: 1.25; margin-top: 18px; text-wrap: balance; }
.role { font-family: var(--font-display); font-weight: 500; font-size: clamp(20px, 3vw, 26px); color: var(--accent); margin-top: 6px; }
.lead { max-width: 46ch; margin-top: 18px; color: var(--muted); font-size: 18px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

.portrait-wrap { display: flex; justify-content: center; }
.portrait { position: relative; width: min(400px, 100%); aspect-ratio: 3 / 4; }
.portrait::before {
  content: ""; position: absolute; inset: 0; transform: translate(-16px, 14px);
  border: 2px solid var(--accent); border-radius: 999px 999px 28px 28px; opacity: .55;
}
.portrait .arch { position: absolute; inset: 0; background: var(--sky); border-radius: 999px 999px 28px 28px; overflow: hidden; }
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }

/* lower grid */
.lower { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 24px; align-items: start; padding-bottom: 40px; }
.info { display: grid; gap: 24px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; min-width: 0; scroll-margin-top: 16px; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3vw, 30px); line-height: 1.3; }
.card .sub { color: var(--muted); margin-top: 4px; }

.hours { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 6px; }
.hours li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; }
.hours .day { font-weight: 600; display: flex; align-items: center; gap: 10px; }
.hours .time { font-variant-numeric: tabular-nums; color: var(--muted); }
.hours li.off .time { color: var(--danger); font-weight: 600; }
.hours li.today { background: var(--sky); }
.hours li.today .time { color: var(--ink); font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--brand); color: var(--on-brand); }

.addr { margin-top: 14px; font-size: 18px; font-weight: 500; }
.card .btn { margin-top: 18px; }
.fine { font-size: 14px; color: var(--muted); margin-top: 12px; }

/* form */
.form-card h2 { margin-bottom: 4px; }
form { display: grid; gap: 18px; margin-top: 22px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 15px; }
.opt { font-weight: 400; color: var(--muted); font-size: 13px; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--font-body); text-align: right;
}
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 28%, transparent); }
input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--danger); }
input[type="tel"] { direction: ltr; text-align: right; }
select:disabled { opacity: .6; }
.err { color: var(--danger); font-size: 14px; font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.send { width: 100%; min-height: 54px; font-size: 17px; }
.note { font-size: 14px; color: var(--muted); text-align: center; }

.sent { margin-top: 20px; padding: 18px; border-radius: 16px; background: var(--sky); display: grid; gap: 12px; }
.sent[hidden], .err[hidden] { display: none; }
.sent p { font-weight: 500; }
.sent textarea { min-height: 150px; direction: rtl; font-size: 15px; }
.sent .num { font-weight: 700; direction: ltr; unicode-bidi: isolate; }

/* floating whatsapp */
.fab {
  position: fixed; z-index: 20;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 20px;
  border-radius: 999px; background: var(--wa); color: var(--on-wa);
  font: 600 16px/1 var(--font-body); text-decoration: none;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
}
.fab svg { width: 24px; height: 24px; }

footer { border-top: 1px solid var(--line); padding-block: 22px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; gap: 28px; padding-bottom: 36px; }
  .portrait { width: min(320px, 82%); }
  .portrait-wrap { padding-inline-start: 16px; }
  .lower { grid-template-columns: 1fr; }
  .form-card { order: -1; }
  .top nav a:not(.btn) { display: none; }
}
@media (max-width: 520px) {
  .row2 { grid-template-columns: 1fr; }
  .card { padding: 22px 18px; }
  .btn { flex: 1 1 auto; }
  .fab span { display: none; }
  .fab { padding: 0; width: 54px; justify-content: center; }
}
</style>
</head>
